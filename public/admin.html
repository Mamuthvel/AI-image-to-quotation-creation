<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Limras Electricals Agency — Item Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<header class="masthead">
  <div class="mark">
    <span class="mark-rule" aria-hidden="true"></span>
    <div>
      <h1>Item Master</h1>
      <p class="mark-sub">Add, edit and retire items in the quotation catalogue</p>
    </div>
  </div>
  <div class="masthead-meta">
    <span id="countPill" class="pill pill-idle">Loading…</span>
    <a href="/" class="btn btn-ghost">Back to quotation desk</a>
  </div>
</header>

<main class="admin-shell">
  <div class="admin-toolbar">
    <input id="search" type="search" placeholder="Search by name, SKU, brand or category…" autocomplete="off" />
    <button id="btnAdd" class="btn btn-solid" type="button">+ Add item</button>
  </div>

  <div class="table-wrap">
    <table class="grid admin-grid">
      <thead>
        <tr>
          <th>SKU</th>
          <th>Name</th>
          <th>Brand</th>
          <th>Category</th>
          <th>UOM</th>
          <th class="num">Rate</th>
          <th class="num">Popularity</th>
          <th><span class="sr-only">Actions</span></th>
        </tr>
      </thead>
      <tbody id="itemRows"></tbody>
    </table>
  </div>
  <p id="emptyMsg" class="admin-empty" hidden>No items match that search.</p>
</main>

<!-- add / edit item -->
<div id="itemModal" class="picker" hidden>
  <div class="picker-card admin-form-card" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <header>
      <h2 id="formTitle">Add item</h2>
      <button id="formClose" class="btn btn-ghost" type="button">Close</button>
    </header>
    <form id="itemForm" class="admin-form">
      <div class="admin-form-grid">
        <label>SKU
          <input id="f-sku" type="text" required autocomplete="off" />
        </label>
        <label>Name
          <input id="f-name" type="text" required autocomplete="off" />
        </label>
        <label>Brand
          <input id="f-brand" type="text" required autocomplete="off" list="brandList" />
        </label>
        <label>Category
          <input id="f-category" type="text" required autocomplete="off" list="categoryList" />
        </label>
        <label>UOM
          <input id="f-uom" type="text" value="Nos" autocomplete="off" />
        </label>
        <label>Rate
          <input id="f-rate" type="number" step="0.01" min="0" required />
        </label>
        <label>Popularity <span class="hint">0-100, higher wins ties</span>
          <input id="f-popularity" type="number" step="1" min="0" max="100" value="50" />
        </label>
      </div>
      <label class="admin-attrs">
        Attributes <span class="hint">JSON — e.g. {"sizeInch": 0.75, "grade": 1.5}</span>
        <textarea id="f-attrs" rows="4" spellcheck="false">{}</textarea>
      </label>
      <datalist id="brandList"></datalist>
      <datalist id="categoryList"></datalist>
      <p id="formError" class="admin-form-error" role="alert" hidden></p>
      <div class="admin-form-actions">
        <button type="submit" class="btn btn-solid">Save item</button>
        <button type="button" id="formCancel" class="btn btn-ghost">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
